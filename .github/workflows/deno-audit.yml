# Daily vulnerability audit for Deno dependencies.
# Dependabot security alerts do not cover Deno, so this runs `deno audit`
# and opens (or comments on) a GitHub issue when advisories are found.
name: Deno audit

on:
  schedule:
    - cron: "0 5 * * *"
  push:
    branches: [main]
    paths:
      - "app/deno.json"
      - "app/deno.lock"
      - ".github/workflows/deno-audit.yml"
  pull_request:
    paths:
      - "app/deno.json"
      - "app/deno.lock"
      - ".github/workflows/deno-audit.yml"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.9.7

      # Install exactly what is in deno.lock (never resolves new versions)
      - name: Install dependencies
        run: deno install --frozen

      - name: Audit dependencies
        id: audit
        run: deno audit 2>&1 | tee "$RUNNER_TEMP/audit.txt"

      - name: Outdated dependencies (informational)
        if: always()
        continue-on-error: true
        run: deno outdated

      - name: Open or update issue
        if: failure() && steps.audit.outcome == 'failure' && github.event_name != 'pull_request'
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="deno audit: vulnerabilities found"
          {
            echo "\`deno audit\` reported vulnerabilities on $(date -u +%Y-%m-%d)."
            echo
            echo "Run: $RUN_URL"
            echo
            echo '```'
            sed 's/\x1b\[[0-9;]*m//g' "$RUNNER_TEMP/audit.txt" | tail -c 60000
            echo '```'
          } > "$RUNNER_TEMP/issue.md"

          number=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title \"$title\"" --json number --jq '.[0].number')
          if [ -n "$number" ]; then
            gh issue comment "$number" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/issue.md"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body-file "$RUNNER_TEMP/issue.md"
          fi
