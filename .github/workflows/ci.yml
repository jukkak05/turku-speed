# CI/CD: lint, type check and test the app, then build the Docker image.
#
# - Pull requests to main or dev: run tests and check that the image builds (nothing is pushed)
# - Push to dev (e.g. merged PR): run tests and check that the image builds
# - Push to main (e.g. merged PR) or a v* tag: run tests, then publish the image to GHCR
#
# The server then only needs: docker compose pull && docker compose up -d
# Image tags: latest (main), sha-<short sha>, and semver tags for v* git tags.
name: CI/CD

on:
  push:
    branches: [main, dev]
    tags: ["v*"]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Cancel superseded PR runs, but never interrupt a publish
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Same Deno version as the Docker base image
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.9.7

      # Install exactly what is in deno.lock (never resolves new versions)
      - name: Install dependencies
        run: deno install --frozen

      - name: Lint and type check
        run: deno task check

      - name: Test
        run: deno task test

  docker:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      PUSH: ${{ github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        if: env.PUSH == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      # Build locally first and test it the way production runs it
      - name: Build for smoke test
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: turku-speed:smoke
          cache-from: type=gha

      - name: Smoke test
        run: |
          docker run -d --name smoke --read-only --tmpfs /tmp --cap-drop ALL \
            --security-opt no-new-privileges:true -p 8000:8000 turku-speed:smoke
          for i in $(seq 1 30); do
            curl -fsS -o /dev/null http://localhost:8000/ && break
            sleep 1
          done
          curl -fsS -o /dev/null http://localhost:8000/ \
            && curl -fsS -o /dev/null http://localhost:8000/app.js \
            || { docker logs smoke; exit 1; }
          # Let the poller run, then fail on a crash or a denied permission (NotCapable)
          sleep 5
          docker logs smoke
          [ "$(docker inspect -f '{{.State.Running}}' smoke)" = "true" ] || exit 1
          ! docker logs smoke 2>&1 | grep -q NotCapable
          docker rm -f smoke

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
