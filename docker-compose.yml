services:
  turku-speed:
    image: ghcr.io/jukkak05/turku-speed:latest
    restart: unless-stopped
    # .env lives next to this file on the server (see app/.env.example)
    env_file: .env
    expose:
      - "8000"
    networks:
      - proxy-net
    # Hardening: no capabilities, no privilege escalation, read-only filesystem
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs: [/tmp]
    # Init process forwards SIGTERM, so docker stop doesn't wait 10s for SIGKILL
    init: true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  proxy-net:
    external: true
    name: proxy-net
